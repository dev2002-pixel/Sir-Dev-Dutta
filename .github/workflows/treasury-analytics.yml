name: Treasury Analytics

on:
  push:
    branches: [main]
    paths:
      - "treasury-working-capital/**"
      - ".github/workflows/treasury-analytics.yml"
  workflow_dispatch:

jobs:
  run-analysis:
    name: Run treasury analytics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treasury-working-capital
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Generate analytics tables and visuals
        run: python src/main_analytics.py
      - name: Run tests
        run: python -m pytest -q
